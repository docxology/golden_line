# Implementation facts used to ground formal-method numbers in the manuscript.
# These entries support reproducibility of the code description only; they do
# not establish that an aspiration is true or universally valid.
#
# Every `kind: number` row is re-derived from its `source` by
# tests/test_formalism_bindings.py; a row with no executable source may not be
# added without also adding its derivation there.
claims:
  - id: registry_entry_count
    kind: number
    value: 9
    source: src/golden_line/registry.py GOLDEN_ASPIRATIONS
    source_tier: claim_ledger
  - id: aspiration_field_count
    kind: number
    value: 6
    source: src/golden_line/models.py Aspiration
    source_tier: claim_ledger
  - id: finding_field_count
    kind: number
    value: 12
    source: src/golden_line/models.py HorizonFinding
    source_tier: claim_ledger
  - id: status_definition_count
    kind: number
    value: 4
    source: src/golden_line/models.py HorizonStatus
    source_tier: claim_ledger
  - id: invariant_count
    kind: number
    value: 7
    source: src/golden_line/invariants.py _CHECKS
    source_tier: claim_ledger
  - id: formal_definition_count
    kind: number
    value: 11
    source: manuscript/02a_formalism.md .definition blocks
    source_tier: claim_ledger
  - id: formal_proposition_count
    kind: number
    value: 13
    source: manuscript/02a_formalism.md .proposition blocks
    source_tier: claim_ledger
  # The number the renderer assigns to the def:matching block. It is not
