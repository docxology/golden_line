name: Standalone validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  no-sibling-checkout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: uv sync --locked
      - run: uv run python -m golden_line.release_evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: evidence-${{ matrix.python }}-${{ github.sha }}
          path: output/evidence/
